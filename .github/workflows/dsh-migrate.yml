name: dsh-migrate

on:
  workflow_dispatch:
    inputs:
      dsh_release:
        description: Target dsh release (empty = latest)
        required: false
        type: string
      bump_again:
        description: Repeat a processed release (not while its proposal PR is open)
        required: false
        type: boolean
        default: false
      auto_merge:
        description: Merge the proposal when every check passed (a draft proposal is always left alone)
        required: false
        type: boolean
        default: true

# Creates the proposal branch, issue and pull request with the repository token.
# It needs the repository setting "Allow GitHub Actions to create and approve
# pull requests"; without it the pull request call fails with HTTP 403.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Bump versions and run checks (no LLM)
        id: migrate
        uses: QZLin/dsh-migrate-bot@v3 # v3.0.1
        with:
          command: bump
          target: ${{ inputs.dsh_release || 'latest' }}
          force: ${{ inputs.bump_again }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The Action is a composite one: it edits manifests and leaves the checkout
      # on the proposal branch, as the runner's own user. The lockfile and the
      # README's version references follow it here, so a merged proposal leaves
      # the repository consistent.
      - name: Set up pnpm
        if: steps.migrate.outputs.status == 'proposed'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Refresh the lockfile and version references
        if: steps.migrate.outputs.status == 'proposed'
        run: |
          node scripts/sync-metadata.mjs
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit them to the proposal
        if: steps.migrate.outputs.status == 'proposed'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "the lockfile and the version references are already current"
            exit 0
          fi
          git commit -m 'chore: refresh the lockfile and version references'
          git push origin HEAD:refs/heads/dsh-migrate/proposal

      # Only a proposal whose every check passed arrives here as a ready pull
      # request: a failing one is a draft, and a draft is left for the maintainer.
      - name: Merge the proposal
        if: steps.migrate.outputs.status == 'proposed' && inputs.auto_merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.migrate.outputs.pull_request_url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "the migration published no pull request"
            exit 0
          fi
          if [ "$(gh pr view "$PR_URL" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "the proposal is a draft because a check failed: leaving it for the maintainer"
            exit 0
          fi
          # GitHub computes a fresh push's mergeability asynchronously, so the
          # first attempt can see it unknown.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR_URL" --squash; then
              echo "merged $PR_URL"
              exit 0
            fi
            echo "merge attempt $attempt did not succeed yet; retrying"
            sleep 10
          done
          echo "::error::could not merge the proposal automatically; merge it by hand"
          exit 1
