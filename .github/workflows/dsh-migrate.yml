name: dsh-migrate

on:
  workflow_dispatch:
    inputs:
      dsh_release:
        description: Target dsh release (empty = latest)
        required: false
        type: string
      bump_again:
        description: Repeat a processed release (not while its proposal PR is open)
        required: false
        type: boolean
        default: false

# Creates the proposal branch, issue and pull request with the repository token.
# It needs the repository setting "Allow GitHub Actions to create and approve
# pull requests"; without it the pull request call fails with HTTP 403.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Bump versions and run checks (no LLM)
        id: migrate
        uses: QZLin/dsh-migrate-bot@c3314bbe440e023320236c12207649626ecadfc3 # v2.0.0
        with:
          command: bump
          target: ${{ inputs.dsh_release || 'latest' }}
          force: ${{ inputs.bump_again }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
